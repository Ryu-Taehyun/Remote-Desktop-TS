name: Build Windows EXE

on:
  push:
    tags: ["v*"]        # v1.0.0 같은 태그를 push 하면 빌드 후 Releases 에 업로드
  workflow_dispatch:    # Actions 탭에서 수동 실행 (아티팩트로만 업로드)

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r agent/requirements.txt "pyinstaller>=6.11,<7"

      - name: Build RemoteDesktopHost.exe
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name RemoteDesktopHost
          --hidden-import pynput.keyboard._win32
          --hidden-import pynput.mouse._win32
          run_host.py

      - name: Smoke test (imports inside the bundle)
        shell: pwsh
        run: |
          if (-not (Test-Path dist/RemoteDesktopHost.exe)) { throw "exe not built" }
          (Get-Item dist/RemoteDesktopHost.exe).Length / 1MB

      - uses: actions/upload-artifact@v4
        with:
          name: RemoteDesktopHost
          path: dist/RemoteDesktopHost.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/RemoteDesktopHost.exe
          generate_release_notes: true
