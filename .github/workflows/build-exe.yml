name: Build Windows EXE

on:
  push:
    branches: [main]    # 호스트 앱 코드가 바뀌면 자동으로 빌드 → 새 Release(v1.0.<실행번호>)
    paths:
      - "agent/**"
      - "run_host.py"
      - ".github/workflows/build-exe.yml"
    tags: ["v*"]        # v1.2.0 같은 태그를 직접 push 하면 그 이름으로 Release
  workflow_dispatch:    # Actions 탭에서 수동 실행

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r agent/requirements.txt "pyinstaller>=6.11,<7"

      - name: Build RemoteDesktopHost.exe
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name RemoteDesktopHost
          --hidden-import pynput.keyboard._win32
          --hidden-import pynput.mouse._win32
          run_host.py

      - name: Smoke test (imports inside the bundle)
        shell: pwsh
        run: |
          if (-not (Test-Path dist/RemoteDesktopHost.exe)) { throw "exe not built" }
          (Get-Item dist/RemoteDesktopHost.exe).Length / 1MB

      - uses: actions/upload-artifact@v4
        with:
          name: RemoteDesktopHost
          path: dist/RemoteDesktopHost.exe

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          name: RemoteDesktopHost ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          files: dist/RemoteDesktopHost.exe
          generate_release_notes: true
          make_latest: true
